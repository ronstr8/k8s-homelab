apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt PRODUCTION server
    server: https://acme-v02.api.letsencrypt.org/directory
    # ⚠️ IMPORTANT: Replace with your actual email address for notifications
    email: user@example.com  # replaced at apply time by kind-setup.sh via $ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
