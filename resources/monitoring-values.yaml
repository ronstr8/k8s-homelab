# kube-prometheus-stack values tuned for a single-node Kind homelab.

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
    receivers:
      - name: 'null'
    # To add email alerts, replace the null receiver:
    # receivers:
    #   - name: email
    #     email_configs:
    #       - to: you@example.com
    #         from: alertmanager@example.com
    #         smarthost: smtp.gmail.com:587
    #         auth_username: you@example.com
    #         auth_password: <app-password>

prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

grafana:
  # adminPassword is set via --set at install time (GRAFANA_PASSWORD env var)
  # Recreate (not RollingUpdate) — the PVC is ReadWriteOnce, so on upgrade the
  # new pod can't attach the volume while the old pod still holds it, and the
  # old pod won't terminate until the new one is ready. RollingUpdate deadlocks
  # ("progress deadline exceeded"); Recreate kills the old pod first.
  deploymentStrategy:
    type: Recreate
  # The init-chown-data container chowns the data dir as root, but fails with
  # "Permission denied" on this local-path/hostPath-backed volume. It's
  # redundant anyway: fsGroup (472) makes the kubelet group-own the volume on
  # mount, so grafana (runAsUser 472) can write without the chown.
  initChownData:
    enabled: false
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.example.com
  persistence:
    enabled: true
    storageClassName: standard
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
